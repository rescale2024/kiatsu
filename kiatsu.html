<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1ec">
<title>きあつ予報</title>
<style>
  :root{
    --bg:#f4f1ec; --card:#ffffff; --ink:#2b2a28; --sub:#7a766f; --line:#e6e1d8;
    --accent:#3d6f8e; --accent-soft:#dfeaf1;
    --ok:#5b9a6f; --warn:#e0a03a; --bad:#d4583f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%}
  main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  h1{font-size:20px;margin:0;letter-spacing:.05em}
  .loc{font-size:13px;color:var(--sub);background:none;border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;cursor:pointer}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .now{display:flex;gap:16px;align-items:center}
  .now .big{font-size:40px;font-weight:700;line-height:1}
  .now .unit{font-size:14px;color:var(--sub);margin-left:4px;font-weight:400}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
  .lv0{background:var(--ok)} .lv1{background:var(--warn)} .lv2{background:var(--bad)}
  .trend{font-size:13px;color:var(--sub);margin-top:6px}
  .msg{margin-top:12px;font-size:15px;line-height:1.6}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;
    font-size:14px;color:var(--sub);cursor:pointer}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chartwrap{position:relative}
  canvas{width:100%;height:260px;display:block;touch-action:pan-y}
  .tip{position:absolute;top:0;pointer-events:none;background:rgba(43,42,40,.88);color:#fff;
    font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;display:none;transform:translateX(-50%)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .day{display:grid;grid-template-columns:72px 34px 1fr auto;align-items:center;gap:8px;
    padding:10px 0;border-top:1px solid var(--line)}
  .day:first-child{border-top:none}
  .day .d{font-weight:700;font-size:15px}
  .day .d small{display:block;font-weight:400;color:var(--sub);font-size:12px}
  .day .w{font-size:22px;text-align:center}
  .day .p{font-size:13px;color:var(--sub);line-height:1.5}
  .day .p b{color:var(--ink)}
  .search{display:none}
  .search.open{display:block}
  .search .row{display:flex;gap:6px}
  .search input{flex:1;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .search button{font-size:14px;padding:10px 12px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
  .search .alt{background:var(--accent-soft);color:var(--accent);width:100%;margin-top:8px}
  .results button{display:block;width:100%;text-align:left;background:none;border:none;
    border-top:1px solid var(--line);padding:10px 4px;font-size:15px;cursor:pointer;color:var(--ink)}
  .results button small{color:var(--sub)}
  .note{font-size:12px;color:var(--sub);line-height:1.7}
  .err{color:var(--bad);font-size:14px}
  h2{font-size:15px;margin:0 0 8px}
  .face{display:inline-block;vertical-align:middle}
  .faces{display:flex;gap:4px;align-items:center;justify-content:flex-end}
  .tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;color:#fff}
  .tag.up{background:#e2a917} .tag.down{background:#4f9ad0}
  .nowfaces{text-align:center;font-size:12px;color:var(--sub)}
  .msg .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <header>
    <h1>きあつ予報</h1>
    <button class="loc" id="locBtn">📍 <span id="locName">場所を選ぶ</span></button>
  </header>

  <section class="card search" id="search">
    <div class="row">
      <input id="q" placeholder="市区町村名（例：世田谷区、大阪市）" enterkeyhint="search">
      <button id="qBtn">検索</button>
    </div>
    <button class="alt" id="gpsBtn">現在地を使う</button>
    <div class="results" id="results"></div>
  </section>

  <section class="card" id="nowCard">
    <div class="now">
      <div>
        <div class="big" id="nowP">----<span class="unit">hPa</span></div>
        <div class="trend" id="trend">読み込み中…</div>
      </div>
      <div style="margin-left:auto" id="nowBadge"></div>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <div class="tabs">
      <button data-r="1" class="on">1日</button>
      <button data-r="7">7日</button>
    </div>
    <div class="chartwrap">
      <canvas id="chart"></canvas>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>気圧</span>
      <span id="lgUp"></span>
      <span id="lgDown"></span>
    </div>
  </section>

  <section class="card">
    <h2>日ごとの見通し</h2>
    <div id="days"></div>
  </section>

  <p class="note">
    ・気圧は「現地気圧」（その場所の地表の気圧）です。<br>
    ・注意レベルは3時間での気圧変化で判定しています（下降2hPa以上で注意、3.5hPa以上で警戒、上昇は3hPa以上で注意）。医学的な基準ではなく目安です。黄色の顔は急に上がるとき、水色の顔は急に下がるときのマークです。<br>
    ・位置は約1km単位に丸めてから天気サービスに送っています。<br>
    ・データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（約1時間ごとに更新）
  </p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const WD = ["日","月","火","水","木","金","土"];
  const DROP_WARN = -2, DROP_BAD = -3.5, RISE_WARN = 3;

  let state = { data:null, range:1, loc:null };

  // ---------- storage ----------
  function loadLoc(){ try{ return JSON.parse(localStorage.getItem("kiatsu_loc")); }catch(e){ return null; } }
  function saveLoc(l){ try{ localStorage.setItem("kiatsu_loc", JSON.stringify(l)); }catch(e){} }

  // ---------- helpers ----------
  const pad = n => String(n).padStart(2,"0");
  const parseT = s => { // "2026-11-09T06:00" as local (Asia/Tokyo from API)
    const [d,t] = s.split("T"); const [y,m,dd] = d.split("-").map(Number); const [h,mi] = t.split(":").map(Number);
    return new Date(y, m-1, dd, h, mi);
  };
  function wIcon(c){
    if(c===0) return "☀️"; if(c<=2) return "🌤️"; if(c===3) return "☁️";
    if(c<=48) return "🌫️"; if(c<=57) return "🌦️"; if(c<=67) return "🌧️";
    if(c<=77) return "❄️"; if(c<=82) return "🌧️"; if(c<=86) return "🌨️"; return "⛈️";
  }
  function levelOf(d3){
    if(d3 == null || isNaN(d3)) return 0;
    if(d3 <= DROP_BAD) return 2;
    if(d3 <= DROP_WARN || d3 >= RISE_WARN) return 1;
    return 0;
  }
  const LV_TXT = ["安定","注意","警戒"];

  // ---------- face marks ----------
  const FACE = {
    up: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'+
      '<circle cx="20" cy="21" r="17" fill="#FFD84D" stroke="#E9B521" stroke-width="2"/>'+
      '<path d="M10.5 15.5l5.5-2M29.5 15.5l-5.5-2" fill="none" stroke="#5b4320" stroke-width="2" stroke-linecap="round"/>'+
      '<circle cx="14.5" cy="20" r="2.3" fill="#5b4320"/><circle cx="25.5" cy="20" r="2.3" fill="#5b4320"/>'+
      '<circle cx="15.3" cy="19.2" r=".7" fill="#fff"/><circle cx="26.3" cy="19.2" r=".7" fill="#fff"/>'+
      '<ellipse cx="10" cy="26" rx="3.4" ry="2.1" fill="#FF8FA3" opacity=".7"/>'+
      '<ellipse cx="30" cy="26" rx="3.4" ry="2.1" fill="#FF8FA3" opacity=".7"/>'+
      '<path d="M14.5 28.5q1.4-2 2.75 0t2.75 0t2.75 0t2.75 0" fill="none" stroke="#5b4320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M34 6q-3 4.5 0 6q3-1.5 0-6z" fill="#fff" stroke="#E9B521" stroke-width="1.3"/></svg>',
    down: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'+
      '<circle cx="20" cy="21" r="17" fill="#9CCEF0" stroke="#5FA3D3" stroke-width="2"/>'+
      '<path d="M10.5 15.5l5.5-2M29.5 15.5l-5.5-2" fill="none" stroke="#2f4f6a" stroke-width="2" stroke-linecap="round"/>'+
      '<circle cx="14.5" cy="20" r="2.3" fill="#2f4f6a"/><circle cx="25.5" cy="20" r="2.3" fill="#2f4f6a"/>'+
      '<circle cx="15.3" cy="19.2" r=".7" fill="#fff"/><circle cx="26.3" cy="19.2" r=".7" fill="#fff"/>'+
      '<ellipse cx="10" cy="26" rx="3.4" ry="2.1" fill="#FF8FA3" opacity=".6"/>'+
      '<ellipse cx="30" cy="26" rx="3.4" ry="2.1" fill="#FF8FA3" opacity=".6"/>'+
      '<path d="M16 29q4-4 8 0" fill="none" stroke="#2f4f6a" stroke-width="2.2" stroke-linecap="round"/>'+
      '<path d="M34 6q-3 4.5 0 6q3-1.5 0-6z" fill="#fff" stroke="#5FA3D3" stroke-width="1.3"/></svg>'
  };
  const faceHTML = (k,sz) => '<span class="face" style="width:'+sz+'px;height:'+sz+'px">'+FACE[k].replace('<svg ','<svg width="'+sz+'" height="'+sz+'" ')+'</span>';
  const FACE_IMG = {};
  ["up","down"].forEach(k => { const im = new Image(); im.onload = () => state.data && renderChart();
    im.src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(FACE[k]); FACE_IMG[k] = im; });
  const dirOf = x => x.lv ? (x.d3 < 0 ? "down" : "up") : null;
  // group consecutive rapid-change hours of the same direction
  function windows(pts){
    const out = []; let w = null;
    pts.forEach(x => {
      const d = dirOf(x);
      if(d && w && w.dir===d){ w.to = x.t; w.pts.push(x); w.lv = Math.max(w.lv, x.lv); }
      else { if(w) out.push(w); w = d ? {dir:d, from:x.t, to:x.t, lv:x.lv, pts:[x]} : null; }
    });
    if(w) out.push(w);
    out.forEach(w => w.peak = w.pts.reduce((a,b) => Math.abs(b.d3)>Math.abs(a.d3)?b:a));
    return out;
  }
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  // ---------- fetch ----------
  async function fetchForecast(loc){
    const r2 = v => (+v).toFixed(2); // 約1km単位に丸めて送信
    const u = "https://api.open-meteo.com/v1/forecast?latitude="+r2(loc.lat)+"&longitude="+r2(loc.lon)+
      "&hourly=surface_pressure,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min"+
      "&past_days=1&forecast_days=7&timezone=Asia%2FTokyo";
    const r = await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const t = j.hourly.time.map(parseT), p = j.hourly.surface_pressure;
    const pts = [];
    for(let i=0;i<t.length;i++){
      if(p[i]==null) continue;
      const d3 = i>=3 && p[i-3]!=null ? p[i]-p[i-3] : null;
      pts.push({t:t[i], p:p[i], d3, lv:levelOf(d3)});
    }
    return { pts, daily:j.daily };
  }

  async function geocode(q){
    const u = "https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=8&language=ja&format=json";
    const r = await fetch(u); const j = await r.json(); return j.results || [];
  }

  // ---------- render: now ----------
  function renderNow(){
    const pts = state.data.pts, now = new Date();
    let i = pts.findIndex(x => x.t > now); i = i<=0 ? 0 : i-1;
    const cur = pts[i];
    const at = h => pts[Math.min(i+h, pts.length-1)];
    const c3 = at(3).p - cur.p, c6 = at(6).p - cur.p;
    const arrow = v => v <= -1 ? "↘" : v >= 1 ? "↗" : "→";
    const fmt = v => { const r = Math.round(v*10)/10; return r===0 ? "±0" : (r>0?"+":"")+r.toFixed(1); };
    $("nowP").innerHTML = cur.p.toFixed(0)+'<span class="unit">hPa</span>';
    $("trend").textContent = "3時間後 "+arrow(c3)+" "+fmt(c3)+"　6時間後 "+arrow(c6)+" "+fmt(c6);

    // next 24h max level
    const next = pts.slice(i, i+24);
    const hasUp = next.some(x=>dirOf(x)==="up"), hasDown = next.some(x=>dirOf(x)==="down");
    $("nowBadge").innerHTML = (hasUp||hasDown)
      ? '<div class="nowfaces"><div class="faces" style="justify-content:center">'+(hasDown?faceHTML("down",40):"")+(hasUp?faceHTML("up",40):"")+'</div>24時間以内</div>'
      : '<span class="badge lv0">24時間 安定</span>';

    const win = windows(pts.slice(i, i+48));
    const dayLbl = d => {
      const t0 = new Date(); t0.setHours(0,0,0,0);
      const diff = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - t0)/864e5);
      return ["今日","明日","明後日"][diff] ?? (d.getMonth()+1)+"/"+d.getDate();
    };
    let msg;
    if(!win.length){
      msg = "この先48時間は大きな気圧変化はなさそうです。";
    } else {
      msg = win.slice(0,3).map(w => {
        const from = new Date(w.from.getTime()-3*3600e3); // change happens over the preceding 3h
        return '<div class="row">'+faceHTML(w.dir,30)+'<div><b>'+dayLbl(from)+" "+from.getHours()+"時ごろ〜"+(dayLbl(w.to)!==dayLbl(from)?dayLbl(w.to)+" ":"")+w.to.getHours()+"時ごろ</b><br>"+
          (w.dir==="down"?"気圧が急に下がります":"気圧が急に上がります")+'　<span class="tag '+w.dir+'">'+LV_TXT[w.lv]+"</span></div></div>";
      }).join("");
    }
    $("msg").innerHTML = msg;
  }

  // ---------- render: chart ----------
  let geom = null;
  function renderChart(){
    const cv = $("chart"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    const now = new Date();
    const day1 = state.range===1;
    const start = day1 ? new Date(now.getTime()-3*3600e3) : new Date(now.getTime()-24*3600e3);
    const end = day1 ? new Date(now.getTime()+24*3600e3) : new Date(now.getTime()+7*24*3600e3);
    const pts = state.data.pts.filter(x => x.t>=start && x.t<=end);
    if(pts.length<2) return;

    const L=38, R=8, T=18, B=40, stripH=8;
    const pw = W-L-R, ph = H-T-B;
    let lo = Math.min(...pts.map(x=>x.p)), hi = Math.max(...pts.map(x=>x.p));
    const padv = Math.max(2.5, (hi-lo)*0.22); lo = Math.floor(lo-padv); hi = Math.ceil(hi+padv);
    const t0 = pts[0].t.getTime(), t1 = pts[pts.length-1].t.getTime();
    const X = t => L + (t - t0)/(t1 - t0)*pw;
    const Y = p => T + (hi - p)/(hi - lo)*ph;
    geom = {pts, X, Y, L, R, W};

    // risk shading
    const step = (X(t0+3600e3)-X(t0));
    pts.forEach(x => {
      if(!x.lv) return;
      const up = dirOf(x)==="up", a = x.lv===2 ? .26 : .15;
      ctx.fillStyle = up ? "rgba(255,206,60,"+a+")" : "rgba(95,163,211,"+a+")"; ctx.fillRect(X(x.t)-step, T, step, ph);
      ctx.fillStyle = up ? (x.lv===2?"#E9A800":"#F7CF4A") : (x.lv===2?"#3E86BE":"#8CC2E8");
      ctx.fillRect(X(x.t)-step, T+ph+2, step, stripH);
    });

    // y grid
    ctx.font = "11px sans-serif"; ctx.fillStyle = css("--sub"); ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
    const span = hi-lo, gs = span>30?10: span>12?5: 2;
    for(let v=Math.ceil(lo/gs)*gs; v<=hi; v+=gs){
      ctx.beginPath(); ctx.moveTo(L,Y(v)); ctx.lineTo(W-R,Y(v)); ctx.stroke();
      ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(v, L-4, Y(v));
    }

    // day separators & labels
    ctx.textAlign="center"; ctx.textBaseline="top";
    const d = new Date(t0); d.setHours(0,0,0,0);
    for(let dt=d.getTime()+864e5; dt<=t1; dt+=864e5){
      const x = X(dt);
      ctx.strokeStyle = "#cfc8bc"; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,T+ph); ctx.stroke(); ctx.setLineDash([]);
    }
    for(let dt=d.getTime(); dt<=t1; dt+=864e5){
      const mid = Math.max(dt, t0) + (Math.min(dt+864e5, t1) - Math.max(dt, t0))/2;
      if(Math.min(dt+864e5,t1) - Math.max(dt,t0) < (day1?3:6)*3600e3) continue;
      const dd = new Date(dt); ctx.fillStyle = dd.getDay()===0?"#c0504d":dd.getDay()===6?"#3d6f8e":css("--sub");
      if(day1) ctx.fillText((dd.getMonth()+1)+"/"+dd.getDate()+"("+WD[dd.getDay()]+")", X(mid), T+ph+stripH+8);
      else { ctx.fillText(dd.getDate()+"日", X(mid), T+ph+stripH+6); ctx.fillText(WD[dd.getDay()], X(mid), T+ph+stripH+20); }
    }
    if(day1){ // hour ticks
      ctx.fillStyle = css("--sub"); ctx.font="10px sans-serif";
      pts.forEach(x => { const h = x.t.getHours(); if(h%3===0 && h!==0){
        ctx.fillText(h+"時", X(x.t), T+ph+stripH+22);
        ctx.strokeStyle = "rgba(0,0,0,.05)"; ctx.beginPath(); ctx.moveTo(X(x.t),T); ctx.lineTo(X(x.t),T+ph); ctx.stroke(); } });
    }

    // area + line
    const g = ctx.createLinearGradient(0,T,0,T+ph);
    g.addColorStop(0,"rgba(61,111,142,.25)"); g.addColorStop(1,"rgba(61,111,142,0)");
    ctx.beginPath(); pts.forEach((x,k)=> k?ctx.lineTo(X(x.t),Y(x.p)):ctx.moveTo(X(x.t),Y(x.p)));
    ctx.lineTo(X(t1),T+ph); ctx.lineTo(X(t0),T+ph); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); pts.forEach((x,k)=> k?ctx.lineTo(X(x.t),Y(x.p)):ctx.moveTo(X(x.t),Y(x.p)));
    ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2.2; ctx.lineJoin="round"; ctx.stroke();

    // past dimming + now line
    const xn = X(now.getTime());
    ctx.fillStyle = "rgba(244,241,236,.55)"; ctx.fillRect(L, T, xn-L, ph);
    ctx.strokeStyle = css("--ink"); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(xn,T); ctx.lineTo(xn,T+ph); ctx.stroke();
    ctx.fillStyle = css("--ink"); ctx.font="bold 11px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText("いま", xn, T-2);

    // face marks at the strongest point of each rapid-change window
    const fs = day1 ? 30 : 22;
    windows(pts).forEach(w => {
      const im = FACE_IMG[w.dir]; if(!im || !im.complete) return;
      const px = X(w.peak.t) - step/2, py = Y(w.peak.p);
      let fy = w.dir==="up" ? py - fs - 6 : py + 6;
      fy = Math.max(T, Math.min(T+ph-fs, fy));
      const fx = Math.max(L, Math.min(W-R-fs, px - fs/2));
      ctx.drawImage(im, fx, fy, fs, fs);
    });
  }

  function showTip(clientX){
    if(!geom) return;
    const cv = $("chart"), rect = cv.getBoundingClientRect(), x = clientX - rect.left;
    let best = null, bd = 1e9;
    geom.pts.forEach(p => { const d = Math.abs(geom.X(p.t)-x); if(d<bd){bd=d;best=p;} });
    if(!best) return;
    const tip = $("tip"), t = best.t;
    tip.innerHTML = (t.getMonth()+1)+"/"+t.getDate()+"("+WD[t.getDay()]+") "+t.getHours()+"時<br><b>"+best.p.toFixed(1)+" hPa</b>"+
      (best.d3!=null?"　3h "+(best.d3>0?"+":"")+best.d3.toFixed(1):"");
    tip.style.display="block";
    const px = Math.min(Math.max(geom.X(t), 60), rect.width-60);
    tip.style.left = px+"px";
  }
  const cv = $("chart");
  cv.addEventListener("pointermove", e => showTip(e.clientX));
  cv.addEventListener("pointerdown", e => showTip(e.clientX));
  cv.addEventListener("pointerleave", () => $("tip").style.display="none");

  // ---------- render: days ----------
  function renderDays(){
    const {pts, daily} = state.data;
    const today = new Date(); today.setHours(0,0,0,0);
    let html = "";
    daily.time.forEach((ds,k) => {
      const d = parseT(ds+"T00:00");
      if(d < today) return;
      const hp = pts.filter(x => x.t.getFullYear()===d.getFullYear() && x.t.getMonth()===d.getMonth() && x.t.getDate()===d.getDate());
      if(!hp.length) return;
      const ps = hp.map(x=>x.p), d3s = hp.map(x=>x.d3).filter(v=>v!=null);
      const lv = Math.max(...hp.map(x=>x.lv));
      const dn = hp.filter(x=>dirOf(x)==="down"), upp = hp.filter(x=>dirOf(x)==="up");
      const mark = !lv ? '<span class="badge lv0">安定</span>' :
        '<div class="faces">'+(dn.length?faceHTML("down",30):"")+(upp.length?faceHTML("up",30):"")+'</div>'+
        (lv===2?'<div style="text-align:right;margin-top:2px"><span class="tag down">警戒</span></div>':"");
      const minD = Math.min(...d3s), maxR = Math.max(...d3s);
      const diff = Math.round((d - today)/864e5);
      const name = ["今日","明日","明後日"][diff] ?? WD[d.getDay()]+"曜";
      html += '<div class="day"><div class="d">'+name+'<small>'+(d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+')</small></div>'+
        '<div class="w">'+wIcon(daily.weather_code[k])+'</div>'+
        '<div class="p"><b>'+Math.min(...ps).toFixed(0)+"〜"+Math.max(...ps).toFixed(0)+' hPa</b><br>'+
        "3時間変化 最大 "+(minD<=-0.05?"▼"+(-minD).toFixed(1):"▼0")+" / "+(maxR>=0.05?"▲"+maxR.toFixed(1):"▲0")+"<br>"+
        Math.round(daily.temperature_2m_min[k])+"〜"+Math.round(daily.temperature_2m_max[k])+"℃</div>"+
        '<div>'+mark+"</div></div>";
    });
    $("days").innerHTML = html;
  }

  // ---------- load ----------
  async function load(){
    $("locName").textContent = state.loc.name;
    $("trend").textContent = "読み込み中…";
    try{
      state.data = await fetchForecast(state.loc);
      renderNow(); renderChart(); renderDays();
    }catch(e){
      $("trend").innerHTML = '<span class="err">データを取得できませんでした。通信環境を確認して再読み込みしてください。</span>';
    }
  }

  // ---------- UI ----------
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); state.range = Number(b.dataset.r); $("tip").style.display="none";
    if(state.data) renderChart();
  }));
  $("locBtn").addEventListener("click", () => $("search").classList.toggle("open"));
  async function doSearch(){
    const q = $("q").value.trim(); if(!q) return;
    $("results").innerHTML = '<div class="note" style="padding:8px 0">検索中…</div>';
    try{
      const rs = await geocode(q);
      if(!rs.length){ $("results").innerHTML='<div class="note" style="padding:8px 0">見つかりませんでした</div>'; return; }
      $("results").innerHTML = "";
      rs.forEach(r => {
        const b = document.createElement("button");
        b.innerHTML = r.name+' <small>'+[r.admin1,r.country].filter(Boolean).join("・")+"</small>";
        b.onclick = () => { state.loc = {name:r.name, lat:r.latitude, lon:r.longitude}; saveLoc(state.loc);
          $("search").classList.remove("open"); $("results").innerHTML=""; load(); };
        $("results").appendChild(b);
      });
    }catch(e){ $("results").innerHTML='<div class="err">検索できませんでした</div>'; }
  }
  $("qBtn").addEventListener("click", doSearch);
  $("q").addEventListener("keydown", e => { if(e.key==="Enter") doSearch(); });
  $("gpsBtn").addEventListener("click", () => {
    if(!navigator.geolocation){ $("results").innerHTML='<div class="err">現在地を取得できません</div>'; return; }
    $("results").innerHTML = '<div class="note" style="padding:8px 0">現在地を取得中…</div>';
    navigator.geolocation.getCurrentPosition(pos => {
      state.loc = {name:"現在地", lat:+pos.coords.latitude.toFixed(2), lon:+pos.coords.longitude.toFixed(2)};
      saveLoc(state.loc); $("search").classList.remove("open"); $("results").innerHTML=""; load();
    }, () => { $("results").innerHTML='<div class="err">現在地を取得できませんでした。地名で検索してください。</div>'; },
    {timeout:10000});
  });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(()=>state.data&&renderChart(), 150); });

  state.loc = loadLoc() || {name:"東京", lat:35.69, lon:139.69};
  if(!loadLoc()) $("search").classList.add("open");
  $("lgUp").innerHTML = faceHTML("up",16)+" 急に上がる";
  $("lgDown").innerHTML = faceHTML("down",16)+" 急に下がる";
  load();
  setInterval(() => { if(document.visibilityState==="visible") load(); }, 60*60*1000);
})();
</script>
</body>
</html>
